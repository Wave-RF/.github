name: Bug report
description: Something doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Before you file:

        - **"How do I…?" questions** belong in this repository's Discussions tab, if it has one.
        - **Security vulnerabilities** must not go in a public issue. Follow the [security policy](https://github.com/Wave-RF/.github/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, package version, or commit SHA you're using.
      placeholder: e.g. v1.2.0 or 3f2c1ab
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime and framework versions, and anything else relevant.
      placeholder: |
        - OS:
        - Runtime (Node, Go, Python, …):
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. It's formatted as code automatically, so no backticks are needed.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, configuration, or anything else that helps.
